name: SentinelEDR CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-and-agent:
    name: Backend & Agent Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r agent/requirements.txt

      - name: Run Pytest Suite (Backend & Agent)
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET_KEY: test-ci-secret-key-32-bytes-minimum
          RULES_DIR: ./rules
        run: |
          pytest backend/tests agent/tests -v

  frontend:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Production Bundle Build
        working-directory: frontend
        run: npm run build
